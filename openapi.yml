    StoreLocation:
      $ref: ./schema/store_location.json
    Terminal:
      $ref: ./schema/terminal.json
    Sale:
      $ref: ./schema/sale.json
    Shift:
      $ref: ./schema/shift.json
  parameters:
    store_location_id:
      name: store_location_id
      in: path
      required: true
      schema:
        type: string
    terminal_id:
      name: terminal_id
      in: path
      required: true
      schema:
        type: string
    sale_id:
      name: sale_id
      in: path
      required: true
      schema:
        type: string
    shift_id:
      name: shift_id
      in: path
      required: true
