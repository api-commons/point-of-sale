context: point-of-sale
name: Point of Sale
intro: >-
  The common point-of-sale vocabulary -- the store locations that sell, the terminals and
  registers at the counter, the sales rung up on them and the shifts worked behind them --
  distilled from the APIs that already exist. Products belong to the commerce context and
  staff to HR.
tags: [Point-of-Sale, POS, Point of Sale, Retail POS, In-Store, Payments Terminal]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, external_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, sale_date, opened_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, sale_status, terminal_status, active, is_active]
  name: [title, display_name, label]
  location_id: [location, store_id, store, outlet_id, outlet, shop_id, site_id, business_location_id, register_location]
  employee_id: [employee, staff_id, team_member_id, user_id, cashier_id, server_id, operator_id]
  currency: [currency_code]
  total: [total_amount, total_price, grand_total, amount, total_money, net_total, total_with_tax]

concepts:
  store_location:
    path: /store-locations
    segments: [locations, location, stores, store, outlets, outlet, shops, shop, sites@pos, business_locations]
    requires: [sale]
    aliases:
      address: [street_address, address_line1, addresses]
      time_zone: [timezone, tz]
      phone: [phone_number, telephone]
      hours: [business_hours, opening_hours]
  terminal:
    requires: [sale]
    # Singular /register is a verb (register a device or product); only registers counts.
    segments: [terminals, terminal, registers, devices@pos|terminals|registers, readers, card_readers, tills, workstations]
    aliases:
      serial_number: [serial, device_serial, serial_no]
      model: [device_model, type, device_type, hardware]
      paired_at: [activated_at, registered_at, last_seen_at]
  sale:
    segments: [sales, sale, transactions@pos|stores|locations|registers, receipts, checks, tickets@pos, orders@pos|registers]
    aliases:
      line_items: [items, sale_lines, lines, products, register_sale_products, order_items]
      subtotal: [sub_total, net_amount, total_before_tax]
      tax: [tax_amount, total_tax, taxes]
      discount: [discount_amount, total_discount, discounts]
      payments: [tenders, payment_types, register_sale_payments]
      customer_id: [customer, client_id]
      register_id: [register, terminal_id, terminal, device_id, till_id]
  shift:
    requires: [sale]
    segments: [shifts, shift, cash_drawer_shifts, cash-drawer-shifts, register_closures, closures, drawers, cash_drawers, timecards, time_cards]
    aliases:
      opened_at: [start_time, started_at, opened, clock_in, start]
      closed_at: [end_time, ended_at, closed, clock_out, end]
      opening_amount: [opening_float, starting_cash, opening_cash, float]
      closing_amount: [closing_float, ending_cash, counted_cash, closing_cash]

exclude:
  sale:
    flowaccount: /receipts are accounting receipts
  store_location:
    happy-cabbage-analytics: /orders/{id}/items/{id}/store assigns a fulfilment store
    caseys-general-stores: /store is the operator's internal store directory

findings:
  - "A store location agrees on name, address, phone, status, country, currency and time zone
    -- the most complete location core in the commons, because a POS needs every one of them
    to ring a sale."
  - "A sale agrees only on an id: POS systems call it a sale, a transaction, a check, a ticket
    or an order, and carry items, taxes and tenders under as many names."
  - "Terminals are thin (4 providers, agreeing only on id and name); shifts (5) agree well --
    employee, location, status and timestamps."
decisions:
  - "Store locations are `/store-locations`: `/locations` means a work site in HR and a
    restaurant in food ordering."
  - "A sale covers sales, receipts, checks and POS transactions and orders."
  - "A shift covers cash-drawer shifts, register closures and timecards."
  - "Singular `/register` is an action and does not count as a terminal."
  - "Products are commerce's and staff are HR's; POS does not duplicate them."
